server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA 라우팅: 없는 경로는 index.html로
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 정적 에셋 캐싱(파일명에 해시가 있다고 가정)
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
