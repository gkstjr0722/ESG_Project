services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    environment:
      VITE_BACKEND_ORIGIN: "http://backend:3001"   # 컨테이너 DNS
      VITE_PUBLIC_HOST: "192.168.111.194"          # 프론트 서버 IP (HMR용)
    working_dir: /app
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks: [app-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      NODE_ENV: "production"
      PORT: "3001"
      STATIC_DIR: "/app/static"
      DB_HOST: "host.docker.internal"
      DB_PORT: "3307"
      DB_USER: "hans123"
      DB_PASS: "hans123"
      DB_NAME: "hans"
      FASTAPI_URL: "http://ai:8000"
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/dist:/app/static:ro
    restart: unless-stopped
    depends_on:
      - ai
    networks: [app-net]

  ai:
    build:
      context: ./AI
      dockerfile: Dockerfile
    container_name: ai
    ports:
      - "8000:8000"
    volumes:
      - ./AI/artifacts:/app/artifacts
    restart: unless-stopped
    networks: [app-net]

networks:
  app-net:
    driver: bridge
